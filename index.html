<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>クイズに正解して、理想の私へ 💕 ダイエットクイズアプリ</title>
<style>
  :root {
    --pink-bg: #fff5f8;
    --pink-soft: #ffe0ec;
    --pink-main: #ff6b9d;
    --pink-deep: #e85a8a;
    --pink-accent: #ffc5d8;
    --text-main: #4a3a42;
    --text-soft: #8a6b78;
    --gold: #f6c752;
    --mint: #8ed6c4;
    --blue: #8fb8e0;
    --lav: #c8a8dd;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    background: linear-gradient(180deg, #fff0f5 0%, #ffe4ee 100%);
    color: var(--text-main);
    min-height: 100vh;
  }
  .app {
    max-width: 440px;
    margin: 0 auto;
    padding: 16px 16px 48px;
  }
  /* ヘッダー */
  header.top {
    background: linear-gradient(135deg, #ff8bb2, #ff6b9d);
    color: #fff;
    border-radius: 22px;
    padding: 14px 18px;
    box-shadow: 0 8px 20px rgba(255, 107, 157, 0.25);
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  header.top .title { font-weight: 700; font-size: 16px; line-height: 1.3; }
  header.top .sub { font-size: 11px; opacity: .9; }
  header.top .heart { font-size: 22px; }

  /* カード共通 */
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(255, 130, 170, 0.12);
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 15px;
    color: var(--pink-deep);
    display: flex; align-items: center; gap: 6px;
  }

  /* ステージ表示 */
  .stage-card { text-align: center; }
  .stage-label {
    display: inline-block;
    background: var(--pink-accent);
    color: var(--pink-deep);
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .stage-weight {
    font-size: 34px;
    font-weight: 700;
    color: var(--pink-deep);
    margin: 6px 0 4px;
  }
  .stage-char {
    width: 180px; height: 240px;
    margin: 4px auto 8px;
    display: block;
    object-fit: contain;
  }
  img.stage-char { width: 180px; height: auto; max-height: 320px; }
  .stage-traits {
    text-align: left;
    font-size: 12px;
    color: var(--text-soft);
    background: var(--pink-bg);
    border-radius: 14px;
    padding: 10px 12px;
    line-height: 1.8;
  }
  .stage-traits .row { display: flex; gap: 6px; }
  .stage-traits .row b {
    color: var(--pink-deep);
    min-width: 44px; font-weight: 700;
  }

  /* EXP / レベル */
  .exp-card { display: flex; flex-direction: column; gap: 8px; }
  .exp-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px;
  }
  .exp-head .lvl-circle {
    background: var(--pink-main);
    color: #fff;
    width: 44px; height: 44px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
    box-shadow: 0 3px 8px rgba(255,107,157,.4);
    flex-direction: column; line-height: 1;
  }
  .exp-head .lvl-circle small { font-size: 9px; font-weight: 600; margin-top: 2px; }
  .exp-bar {
    background: var(--pink-soft);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
    position: relative;
  }
  .exp-fill {
    background: linear-gradient(90deg, #ff8bb2, #ff6b9d);
    height: 100%;
    transition: width .6s ease;
  }
  .exp-text { text-align: right; font-size: 11px; color: var(--text-soft); }

  /* カテゴリ選択 */
  .category-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 6px;
  }
  .cat-btn {
    border: 2px solid var(--pink-soft);
    background: #fff;
    border-radius: 16px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
    color: var(--text-main);
  }
  .cat-btn:hover { transform: translateY(-2px); border-color: var(--pink-main); }
  .cat-btn.random {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #ff8bb2, #ff6b9d);
    color: #fff;
    border-color: transparent;
    font-weight: 700;
  }
  .cat-btn .ico { font-size: 24px; display: block; margin-bottom: 2px; }
  .cat-btn .nm { font-size: 13px; font-weight: 700; }
  .cat-btn .cnt { font-size: 10px; color: var(--text-soft); }
  .cat-btn.random .cnt { color: rgba(255,255,255,.85); }

  /* クイズ画面 */
  .quiz-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--text-soft); margin-bottom: 8px;
  }
  .quiz-cat {
    background: var(--pink-accent);
    color: var(--pink-deep);
    padding: 3px 10px; border-radius: 999px;
    font-weight: 700; font-size: 11px;
  }
  .q-text {
    font-size: 15px; font-weight: 700;
    line-height: 1.55; margin: 10px 0 14px;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    background: #fff;
    border: 2px solid var(--pink-soft);
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    text-align: left;
    color: var(--text-main);
    transition: all .15s;
    display: flex; align-items: center; gap: 10px;
  }
  .choice:hover:not(:disabled) { border-color: var(--pink-main); background: #fff5f8; }
  .choice:disabled { cursor: default; opacity: .95; }
  .choice .letter {
    background: var(--pink-soft);
    color: var(--pink-deep);
    width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .choice.correct {
    background: #e8f7ee; border-color: #6dbf85;
  }
  .choice.correct .letter { background: #6dbf85; color: #fff; }
  .choice.wrong {
    background: #fde8ec; border-color: #e57b8f;
  }
  .choice.wrong .letter { background: #e57b8f; color: #fff; }

  .feedback {
    margin-top: 12px;
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .feedback.ok { background: #e8f7ee; color: #3a8355; }
  .feedback.ng { background: #fde8ec; color: #b54362; }
  .feedback .big {
    font-size: 22px; font-weight: 700; margin-bottom: 4px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .feedback .exp-gain { font-size: 15px; font-weight: 700; }
  .feedback .explain {
    margin-top: 10px; font-size: 12px; color: var(--text-main);
    background: #fff; padding: 10px; border-radius: 10px;
    text-align: left; line-height: 1.6;
  }

  /* 共通ボタン */
  .btn {
    background: linear-gradient(135deg, #ff8bb2, #ff6b9d);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 13px 20px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
    transition: transform .1s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.ghost {
    background: #fff; color: var(--pink-deep);
    border: 2px solid var(--pink-main);
    box-shadow: none;
  }

  .row-btn { display: flex; gap: 10px; margin-top: 12px; }
  .row-btn .btn { flex: 1; }

  /* レベルアップ */
  .levelup-overlay {
    position: fixed; inset: 0;
    background: rgba(255, 192, 220, .88);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    animation: fadein .3s;
  }
  @keyframes fadein { from {opacity: 0;} to {opacity: 1;} }
  .levelup-box {
    background: #fff;
    border-radius: 24px;
    padding: 24px;
    width: 85%; max-width: 360px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(255,107,157,.5);
    animation: pop .5s cubic-bezier(.17,.67,.48,1.2);
  }
  @keyframes pop { from{transform: scale(.4); opacity: 0;} to{transform: scale(1); opacity: 1;} }
  .levelup-box h2 {
    color: var(--pink-deep);
    margin: 0 0 6px;
    font-size: 22px;
    letter-spacing: 1px;
  }
  .levelup-box .sparkle { font-size: 40px; margin: 6px 0; }
  .levelup-box .transform { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0; }
  .levelup-box .transform svg,
  .levelup-box .transform img { width: 90px !important; height: 120px !important; object-fit: contain; }
  .levelup-box .arrow { font-size: 22px; color: var(--pink-main); }
  .levelup-box .weight-change { font-size: 14px; color: var(--text-soft); margin: 6px 0 14px; }
  .levelup-box .weight-change b { color: var(--pink-deep); }

  /* 特徴 */
  .features {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    margin-top: 8px;
  }
  .feat {
    background: var(--pink-bg);
    border-radius: 12px;
    padding: 10px;
    font-size: 11px;
    line-height: 1.4;
  }
  .feat .t { font-weight: 700; color: var(--pink-deep); font-size: 12px; display: block; margin-bottom: 2px; }

  /* 完了画面 */
  .done-card { text-align: center; }
  .done-card .emoji { font-size: 48px; }
  .done-card h2 { color: var(--pink-deep); font-size: 20px; margin: 8px 0; }
  .score { font-size: 30px; font-weight: 700; color: var(--pink-deep); margin: 10px 0; }

  .hidden { display: none !important; }

  /* 小さい画面対応 */
  @media (max-width: 380px) {
    .stage-char { width: 150px; height: 200px; }
    .app { padding: 12px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ヘッダー -->
  <header class="top">
    <span class="heart">💕</span>
    <div>
      <div class="title">クイズに正解して、理想の私へ</div>
      <div class="sub">ダイエットクイズアプリ ✨</div>
    </div>
  </header>

  <!-- ホーム画面 -->
  <section id="home">

    <!-- ステージ&キャラ -->
    <div class="card stage-card">
      <div class="stage-label" id="homeStageLabel">ステージ0（スタート）</div>
      <div class="stage-weight" id="homeWeight">100kg</div>
      <div id="homeCharWrap"></div>
      <div class="stage-traits" id="homeTraits"></div>
    </div>

    <!-- EXP -->
    <div class="card exp-card">
      <div class="exp-head">
        <div>
          <div style="font-size:11px;color:var(--text-soft);">経験値</div>
          <div style="font-size:13px;font-weight:700;" id="expHeadText">0 / 500 EXP</div>
        </div>
        <div class="lvl-circle">
          <span id="lvlNum">0</span><small>Lv</small>
        </div>
      </div>
      <div class="exp-bar"><div class="exp-fill" id="expFill" style="width:0%"></div></div>
      <div class="exp-text" id="expCorrectText">正解数: 0問</div>
    </div>

    <!-- カテゴリ -->
    <div class="card">
      <h2>💖 問題にチャレンジ</h2>
      <div class="category-grid" id="catGrid"></div>
    </div>

    <!-- 特徴 -->
    <div class="card">
      <h2>✨ このアプリの特徴</h2>
      <div class="features">
        <div class="feat"><span class="t">🍽 楽しく学べる</span>食事・運動・睡眠・メンタルを4択で</div>
        <div class="feat"><span class="t">💕 見た目が変化</span>レベルアップで理想の自分に</div>
        <div class="feat"><span class="t">📖 自分のストーリー</span>毎日の積み重ねが力に</div>
        <div class="feat"><span class="t">📊 がんばり可視化</span>正解数でレベルがUP</div>
      </div>
      <div style="margin-top:10px; text-align:center;">
        <button class="btn ghost" onclick="resetConfirm()">進捗をリセット</button>
      </div>
    </div>
  </section>

  <!-- クイズ画面 -->
  <section id="quiz" class="hidden">
    <div class="card">
      <div class="quiz-header">
        <span class="quiz-cat" id="qCat">食事・栄養</span>
        <span id="qProgress">1 / 10</span>
      </div>
      <div class="q-text" id="qText"></div>
      <div class="choices" id="qChoices"></div>
      <div id="qFeedback"></div>
      <div id="qNextWrap" class="hidden">
        <button class="btn" id="qNextBtn">次の問題へ ✨</button>
      </div>
    </div>
    <button class="btn ghost" onclick="endQuiz()">ホームに戻る</button>
  </section>

  <!-- 結果画面 -->
  <section id="done" class="hidden">
    <div class="card done-card">
      <div class="emoji">🎉</div>
      <h2>おつかれさま！</h2>
      <div class="score" id="doneScore">5 / 10 問 正解</div>
      <div style="color:var(--text-soft); font-size:13px;" id="doneMsg">今回の経験値 +500EXP ✨</div>
    </div>
    <button class="btn" onclick="goHome()">ホームに戻る 💕</button>
  </section>

</div>

<!-- レベルアップ用オーバーレイ（JSで挿入） -->
<div id="levelup" class="hidden"></div>

<script>
/* =========================
   ステージ定義
   ========================= */
const STAGES = [
  { lvl:0, label:"ステージ0（スタート）", weight:"100kg", color:"#d8a7a0",
    traits:{ 体型:"全体的にかなりふっくら", 姿勢:"猫背でだるそう", 肌:"くすみ・ニキビ・乾燥", 表情:"疲れていて自信がない", 生活:"不規則・運動習慣なし" } },
  { lvl:1, label:"ステージ1", weight:"80kg", color:"#d8b0a8",
    traits:{ 体型:"脂肪が多く重たそう", 姿勢:"猫背で姿勢が悪い", 肌:"くすみが強く荒れ気味", 表情:"むくみやすく自信がない", 生活:"運動不足・食生活が乱れがち" } },
  { lvl:2, label:"ステージ2", weight:"70kg", color:"#e0b5b0",
    traits:{ 体型:"全体的に丸みが残る", 姿勢:"少し改善の余地あり", 肌:"くすみが少しマシに", 表情:"まだ自信が持てない", 生活:"少しずつ改善を意識" } },
  { lvl:3, label:"ステージ3", weight:"60kg", color:"#e8bcb5",
    traits:{ 体型:"丸みが取れてきた", 姿勢:"徐々に良くなってきた", 肌:"トーンが明るくなってきた", 表情:"自信がついてきた", 生活:"習慣が安定し始める" } },
  { lvl:4, label:"ステージ4", weight:"50kg", color:"#f0c5bc",
    traits:{ 体型:"メリハリのあるスリム体型", 姿勢:"姿勢が良く美しい", 肌:"透明感が増してキレイに", 表情:"明るく自信がある", 生活:"習慣が定着し毎日が充実" } },
  { lvl:5, label:"ステージ5（ゴール）", weight:"45kg", color:"#f6d0c6",
    traits:{ 体型:"理想のスリム体型", 姿勢:"美しくバランスが良い", 肌:"ツヤ・透明感MAX", 表情:"笑顔が素敵で自信満々", 生活:"自分を大切にする毎日" } }
];

/* =========================
   キャラ画像ローダー
   - まずchar-0.png〜char-5.pngを試す
   - 失敗したらSVGにフォールバック
   ========================= */
function charImg(stage, opts = {}) {
  const size = opts.size || 200;
  const id = "char_" + Math.random().toString(36).slice(2, 9);
  // HTMLを返し、loadチェックをDOM挿入後に実行
  setTimeout(() => {
    const img = document.getElementById(id);
    if (!img) return;
    img.onerror = () => {
      const wrap = document.createElement("div");
      wrap.innerHTML = charSVG(stage, opts);
      img.replaceWith(wrap.firstElementChild);
    };
    // もう既にエラー状態なら即実行
    if (img.complete && img.naturalWidth === 0) img.onerror();
  }, 0);
  return `<img id="${id}" src="char-${stage}.png" alt="stage-${stage}" class="stage-char" style="width:${size}px;max-height:${size*1.5}px;">`;
}

/* =========================
   キャラSVG（6段階・フォールバック用）
   - 下半身の幅とサイズで進化を表現
   ========================= */
function charSVG(stage, opts = {}) {
  // stage: 0..5
  // bodyW: 下半身の幅  headW: 顔の幅  hair: 色バリエーション
  const conf = [
    { bodyW: 70, armW: 16, cheek: 7, skinW: 60, smile: 0 },   // 0
    { bodyW: 62, armW: 14, cheek: 6, skinW: 55, smile: 0 },   // 1
    { bodyW: 54, armW: 12, cheek: 5, skinW: 50, smile: 1 },   // 2
    { bodyW: 44, armW: 10, cheek: 4, skinW: 45, smile: 2 },   // 3
    { bodyW: 36, armW: 9,  cheek: 3, skinW: 40, smile: 3 },   // 4
    { bodyW: 32, armW: 8,  cheek: 3, skinW: 38, smile: 4 }    // 5
  ][stage];
  const shirt = ["#d6c4a8","#e8d4b8","#f5c4cf","#f5c4cf","#f2e0dd","#faf2f3"][stage];
  const pants = ["#9a8070","#9a8070","#b58e8a","#b58e8a","#b5c9de","#f8d7e1"][stage];
  const isGoal = stage === 5;
  const isLate = stage >= 4;
  const mouth = conf.smile === 0
    ? `<path d="M 100 120 q 0 4 6 4" stroke="#7a4c4f" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    : conf.smile === 1
    ? `<path d="M 97 120 q 3 3 6 0" stroke="#7a4c4f" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    : conf.smile === 2
    ? `<path d="M 96 119 q 4 4 8 0" stroke="#7a4c4f" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    : conf.smile === 3
    ? `<path d="M 95 118 q 5 6 10 0" stroke="#7a4c4f" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    : `<path d="M 94 117 q 6 8 12 0" stroke="#7a4c4f" stroke-width="2" fill="none" stroke-linecap="round"/>`;

  const sparkles = isGoal ? `
    <g opacity=".9">
      <text x="22" y="30" font-size="16" fill="#f6c752">✦</text>
      <text x="170" y="40" font-size="20" fill="#ffb9d2">✦</text>
      <text x="20" y="150" font-size="14" fill="#c8a8dd">✧</text>
      <text x="175" y="180" font-size="16" fill="#f6c752">✦</text>
      <text x="10" y="220" font-size="12" fill="#ffb9d2">✧</text>
    </g>` : "";

  // 上半身色（シャツ）と下半身色（パンツ/スカート）
  // ゴールはワンピース風
  const lowerShape = isGoal
    ? `<path d="M ${100 - 28} 175
               L ${100 - 38} 235
               L ${100 + 38} 235
               L ${100 + 28} 175 Z"
            fill="${pants}" stroke="#e8a4b8" stroke-width="1.2"/>`
    : `<rect x="${100 - conf.bodyW/2 + 4}" y="175" width="${conf.bodyW - 8}" height="48"
            rx="8" fill="${pants}" stroke="#9a7370" stroke-width="1"/>`;

  // シャツ形
  const upperShape = `
    <path d="M ${100 - conf.skinW/2} 110
             C ${100 - conf.skinW/2 - 6} 140, ${100 - conf.bodyW/2} 160, ${100 - conf.bodyW/2} 180
             L ${100 + conf.bodyW/2} 180
             C ${100 + conf.bodyW/2} 160, ${100 + conf.skinW/2 + 6} 140, ${100 + conf.skinW/2} 110
             Z" fill="${shirt}" stroke="#c9a89b" stroke-width="1.2"/>`;

  // 髪（頭の後ろ）
  const hairBack = `
    <path d="M 74 75
             Q 66 60 78 48
             Q 82 34 98 34
             Q 115 30 126 44
             Q 138 56 128 80
             L 128 96
             Q 120 92 112 92
             Q 105 94 100 92
             Q 95 94 88 92
             Q 80 92 72 96 Z"
          fill="#8c5b44"/>`;

  // お団子
  const bun = `
    <circle cx="98" cy="40" r="11" fill="#8c5b44"/>
    <circle cx="98" cy="40" r="7" fill="#a56d50" opacity=".6"/>`;

  // 顔
  const face = `
    <ellipse cx="100" cy="92" rx="${conf.skinW/2 * 0.6}" ry="${conf.skinW/2 * 0.72}" fill="#f6d7c6" stroke="#c9a89b" stroke-width=".8"/>
    <!-- 前髪 -->
    <path d="M 78 72 Q 100 58 124 74 Q 118 82 110 78 Q 104 85 96 80 Q 88 85 82 82 Z" fill="#8c5b44"/>
    <!-- 目 -->
    <ellipse cx="92" cy="98" rx="2.3" ry="3" fill="#3c2620"/>
    <ellipse cx="108" cy="98" rx="2.3" ry="3" fill="#3c2620"/>
    <circle cx="92.7" cy="97.3" r=".7" fill="#fff"/>
    <circle cx="108.7" cy="97.3" r=".7" fill="#fff"/>
    <!-- ほお -->
    <circle cx="87" cy="108" r="${conf.cheek/1.6}" fill="#f7b9c2" opacity=".7"/>
    <circle cx="113" cy="108" r="${conf.cheek/1.6}" fill="#f7b9c2" opacity=".7"/>
    ${mouth}`;

  // 腕
  const arms = `

  {c:"mind", q:"続かない時に最初にやるとよいのは？", a:["やめる","目標を下げて再設定","もっと厳しくする","人のせいにする"], ans:1, e:"目標のハードルが高すぎるサイン。小さく続けられる形に設計し直しましょう。"},
  {c:"mind", q:"「食べたい」と「お腹すいた」を区別する習慣を何という？", a:["マインドフルイーティング","ストレスイーティング","早食い","夜食"], ans:0, e:"体の空腹と心の空腹を分ける技術。続けるほど無駄食いが減ります。"},
  {c:"mind", q:"睡眠不足の日に太りやすくなる主な理由は？", a:["消化が早い","食欲ホルモンが乱れ高カロリーなものを欲する","運動が減る","代謝が止まる"], ans:1, e:"睡眠不足でレプチンが減りグレリンが増加。甘い物や揚げ物が無性に欲しくなります。"},
];

const CATS = [
  { key:"diet",  name:"食事・栄養",   icon:"🍱", color:"#f5a6b8" },
  { key:"move",  name:"運動",         icon:"🏃‍♀️", color:"#f6c752" },
  { key:"sleep", name:"睡眠",         icon:"🌙", color:"#8fb8e0" },
  { key:"mind",  name:"メンタル・習慣", icon:"💗", color:"#c8a8dd" }
];

/* =========================
   状態管理
   ========================= */
const EXP_PER_LVL = 500;
const MAX_LVL = 5;
const EXP_PER_CORRECT = 100;

const state = load();

function load() {
  try {
    const raw = localStorage.getItem("dietQuizState");
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { exp: 0, correct: 0, answered: 0, seenIds: [] };
}
function save() {
  try { localStorage.setItem("dietQuizState", JSON.stringify(state)); } catch(e){}
}

function getLevel() {
  return Math.min(Math.floor(state.exp / EXP_PER_LVL), MAX_LVL);
}
function getLvlExp() {
  const lvl = getLevel();
  if (lvl >= MAX_LVL) return { cur: EXP_PER_LVL, need: EXP_PER_LVL };
  return { cur: state.exp % EXP_PER_LVL, need: EXP_PER_LVL };
}

/* =========================
   ホーム画面の描画
   ========================= */
function renderHome() {
  const lvl = getLevel();
  const stage = STAGES[lvl];
  document.getElementById("homeStageLabel").textContent = stage.label;
  document.getElementById("homeWeight").textContent = stage.weight;
  document.getElementById("homeCharWrap").innerHTML = charImg(lvl);
  const tr = stage.traits;
  document.getElementById("homeTraits").innerHTML =
    `<div class="row"><b>🍓 体型</b><span>${tr.体型}</span></div>
     <div class="row"><b>🍓 姿勢</b><span>${tr.姿勢}</span></div>
     <div class="row"><b>🍓 肌</b><span>${tr.肌}</span></div>
     <div class="row"><b>🍓 表情</b><span>${tr.表情}</span></div>
     <div class="row"><b>🍓 生活</b><span>${tr.生活}</span></div>`;

  const { cur, need } = getLvlExp();
  document.getElementById("lvlNum").textContent = lvl;
  document.getElementById("expHeadText").textContent =
    (lvl >= MAX_LVL) ? "MAX LEVEL 🎉" : `${cur} / ${need} EXP`;
  document.getElementById("expFill").style.width =
    (lvl >= MAX_LVL ? 100 : cur / need * 100) + "%";
  document.getElementById("expCorrectText").textContent =
    `正解 ${state.correct}問 / 回答 ${state.answered}問`;

  // カテゴリボタン
  const grid = document.getElementById("catGrid");
  grid.innerHTML = "";
  CATS.forEach(cat => {
    const cnt = QUESTIONS.filter(q => q.c === cat.key).length;
    const btn = document.createElement("button");
    btn.className = "cat-btn";
    btn.innerHTML = `
      <span class="ico">${cat.icon}</span>
      <span class="nm">${cat.name}</span>
      <span class="cnt">${cnt}問</span>`;
    btn.onclick = () => startQuiz(cat.key);
    grid.appendChild(btn);
  });
  // ランダム
  const rand = document.createElement("button");
  rand.className = "cat-btn random";
  rand.innerHTML = `
    <span class="ico">🎲</span>
    <span class="nm">ぜんぶからランダム10問</span>
    <span class="cnt">全${QUESTIONS.length}問から</span>`;
  rand.onclick = () => startQuiz("all");
  grid.appendChild(rand);
}

/* =========================
   クイズ処理
   ========================= */
let quiz = null;

function pickQuestions(catKey, n = 10) {
  let pool = catKey === "all" ? [...QUESTIONS] : QUESTIONS.filter(q => q.c === catKey);
  // まだ答えていない問題を優先
  const notSeen = pool.filter(q => !state.seenIds.includes(q.q));
  const fill = (notSeen.length >= n) ? notSeen : [...notSeen, ...pool.filter(q => !notSeen.includes(q))];
  return shuffle(fill).slice(0, Math.min(n, pool.length));
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz(catKey) {
  const questions = pickQuestions(catKey, 10);
  if (questions.length === 0) return;
  quiz = {
    catKey,
    questions,
    idx: 0,
    correct: 0,
    startLvl: getLevel()
  };
  showScreen("quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = quiz.questions[quiz.idx];
  const cat = CATS.find(c => c.key === q.c);
  document.getElementById("qCat").textContent = cat.icon + " " + cat.name;
  document.getElementById("qProgress").textContent = `${quiz.idx + 1} / ${quiz.questions.length}`;
  document.getElementById("qText").textContent = q.q;
  const choicesEl = document.getElementById("qChoices");
  choicesEl.innerHTML = "";
  // 選択肢はそのまま（ABCD）
  const letters = ["A","B","C","D"];
  q.a.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => answer(i, btn);
    choicesEl.appendChild(btn);
  });
  document.getElementById("qFeedback").innerHTML = "";
  document.getElementById("qNextWrap").classList.add("hidden");
}

function answer(picked, btnEl) {
  const q = quiz.questions[quiz.idx];
  const buttons = document.querySelectorAll(".choice");
  buttons.forEach(b => b.disabled = true);

  const isOk = picked === q.ans;
  // 正解/不正解のスタイル
  buttons[q.ans].classList.add("correct");
  if (!isOk) btnEl.classList.add("wrong");

  // フィードバック
  const fb = document.createElement("div");
  fb.className = "feedback " + (isOk ? "ok" : "ng");
  fb.innerHTML = isOk
    ? `<div class="big">✨ 正解！ ✨</div>
       <div class="exp-gain">+${EXP_PER_CORRECT} EXP</div>
       <div class="explain">${q.e}</div>`
    : `<div class="big">💦 惜しい！</div>
       <div class="exp-gain">正解は「${q.a[q.ans]}」</div>
       <div class="explain">${q.e}</div>`;
  document.getElementById("qFeedback").innerHTML = "";
  document.getElementById("qFeedback").appendChild(fb);
  document.getElementById("qNextWrap").classList.remove("hidden");

  // 状態反映
  state.answered += 1;
  if (isOk) {
    quiz.correct += 1;
    state.correct += 1;
    const beforeLvl = getLevel();
    state.exp += EXP_PER_CORRECT;
    const afterLvl = getLevel();
    if (afterLvl > beforeLvl) {
      // ステージアップ！ → 次へボタン押したタイミングで演出
      quiz.levelUpPending = true;
    }
  }
  if (!state.seenIds.includes(q.q)) state.seenIds.push(q.q);
  save();
}

document.getElementById("qNextBtn").onclick = () => {
  if (quiz.levelUpPending) {
    quiz.levelUpPending = false;
    showLevelUp(() => advance());
  } else {
    advance();
  }
};

function advance() {
  quiz.idx += 1;
  if (quiz.idx >= quiz.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function endQuiz() {
  quiz = null;
  showScreen("home");
  renderHome();
}

function finishQuiz() {
  const total = quiz.questions.length;
  document.getElementById("doneScore").textContent = `${quiz.correct} / ${total} 問 正解`;
  const gain = quiz.correct * EXP_PER_CORRECT;
  let msg = `今回の経験値 +${gain} EXP`;
  if (quiz.correct === total) msg = `全問正解！🎊 +${gain} EXP すごい！`;
  else if (quiz.correct === 0) msg = `大丈夫、もう一度挑戦してみよう 💪`;
  document.getElementById("doneMsg").textContent = msg;
  showScreen("done");
}

function goHome() {
  showScreen("home");
  renderHome();
}

/* =========================
   レベルアップ演出
   ========================= */
function showLevelUp(onClose) {
  const lvl = getLevel();
  const prev = STAGES[lvl - 1];
  const cur = STAGES[lvl];
  const overlay = document.getElementById("levelup");
  overlay.className = "levelup-overlay";
  overlay.innerHTML = `
    <div class="levelup-box">
      <div class="sparkle">✨🎉✨</div>
      <h2>レベルアップ！</h2>
      <div style="font-size:13px; color:var(--text-soft);">Level ${lvl - 1} → <b style="color:var(--pink-deep);">Level ${lvl}</b></div>
      <div class="transform">
        ${charImg(lvl - 1, {size: 80})}
        <div class="arrow">➡</div>
        ${charImg(lvl, {size: 80})}
      </div>
      <div class="weight-change"><b>${prev.weight} → ${cur.weight}</b><br><span style="font-size:12px;">${cur.traits.表情}</span></div>
      <button class="btn" id="luClose">つづける 💕</button>
    </div>`;
  overlay.classList.remove("hidden");
  document.getElementById("luClose").onclick = () => {
    overlay.classList.add("hidden");
    onClose();
  };
}

/* =========================
   画面切替 & リセット
   ========================= */
function showScreen(name) {
  ["home","quiz","done"].forEach(id => {
    document.getElementById(id).classList.toggle("hidden", id !== name);
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetConfirm() {
  if (confirm("進捗（レベル・経験値・正解数）をすべてリセットしますか？")) {
    state.exp = 0; state.correct = 0; state.answered = 0; state.seenIds = [];
    save();
    renderHome();
  }
}

/* =========================
   起動
   ========================= */
renderHome();
</script>
